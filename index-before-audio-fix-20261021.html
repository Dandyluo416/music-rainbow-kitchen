function replaceExactlyOnce(source, oldText, nextText){
  const i=source.indexOf(oldText);
  if(i<0)throw Error('找不到預期的程式段落：'+oldText.slice(0,65));
  if(source.indexOf(oldText,i+1)>=0)throw Error('找到重複的程式段落，為避免誤改已停止：'+oldText.slice(0,65));
  return source.slice(0,i)+nextText+source.slice(i+oldText.length);
}
function build(source){
  for(const [from,to] of edits) source=replaceExactlyOnce(source,from,to);
  const end='</body></html>';
  const index=source.lastIndexOf(end);
  if(index<0 || source.slice(index+end.length).trim())throw Error('找不到原始遊戲的 HTML 結尾');
  return source.slice(0,index)+'<scr'+'ipt>'+addonCode+'</scr'+'ipt>'+source.slice(index);
}
const file = 'v2.2-preview.html';
async function load(){
  try{
    const res=await fetch(file+'?v22='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw Error('無法讀取 '+file+'（HTTP '+res.status+'）');
    const original=await res.text();
    if(original.length<100000)throw Error('原始 V2.2 測試檔似乎不完整');
    const updated=build(original);
    document.getElementById('gameFrame').srcdoc=updated;
    document.getElementById('loadStatus').textContent='音樂彩虹廚房 V2.2｜多人遊戲正式入口 · 音訊分組仍待實機驗收';
  }catch(e){
    document.getElementById('error').style.display='block';
    document.getElementById('error').textContent='載入失敗：'+e.message+'\n\n請確認 v2.2-preview.html 已上傳到相同的 GitHub Pages 根目錄。';
    document.getElementById('loadStatus').textContent='未能載入';
  }
}
function extraRules(){
  const expiry="root.child('roomsV22').child($code).child('meta/expiresAt').val() > now";
  const member="root.child('roomsV22').child($code).child('members').child(auth.uid).exists()";
  const host="root.child('roomsV22').child($code).child('meta/hostUid').val() == auth.uid";
  const who="auth != null && ("+host+" || "+member+") && "+expiry;
  const route={
    ".read":who,
    ".write":"auth != null && "+host+" && "+expiry+" && (root.child('roomsV22').child($code).child('public/phase').val() == 'lobby' || root.child('roomsV22').child($code).child('public/phase').val() == 'prep')",
    ".validate":"newData.hasChildren(['version','zones','speakers']) && newData.child('version').val() == 1",
    "version":{".validate":"newData.val() == 1"},
    "zones":{"$uid":{".validate":"newData.isString() && (newData.val() == 'A' || newData.val() == 'B' || newData.val() == 'C' || newData.val() == 'D') && newData.parent().parent().parent().child('members').child($uid).exists()"}},
    "speakers":{"$zone":{".validate":"($zone == 'A' || $zone == 'B' || $zone == 'C' || $zone == 'D') && newData.isString() && newData.parent().parent().parent().child('members').child(newData.val()).exists() && newData.parent().parent().child('zones').child(newData.val()).val() == $zone"}},
    "$other":{".validate":false}
  };
  const signalCheck="newData.hasChildren(['id','sdp','at']) && newData.child('id').isString() && newData.child('id').val().length <= 80 && newData.child('sdp').isString() && newData.child('sdp').val().length <= 65536 && newData.child('at').isNumber() && newData.child('at').val() <= now + 10000 && newData.child('at').val() >= now - 60000";
  const links={"$uid":{
    ".read":"auth != null && (auth.uid == $uid || "+host+") && "+expiry+" && root.child('roomsV22').child($code).child('members').child($uid).exists()",
    "offer":{".write":"auth != null && "+host+" && "+expiry, ".validate":signalCheck},
    "answer":{".write":"auth != null && auth.uid == $uid && "+expiry+" && "+member, ".validate":signalCheck},
    "$other":{".validate":false}
  }};
  return {route,links};
}
async function patchedRules(){
  const res=await fetch('v2.2-rules.json',{cache:'no-store'});
  if(!res.ok)throw Error('找不到原有安全規則（HTTP '+res.status+'）');
  const orig=await res.json();
  const node=orig.rules?.roomsV22?.['$code'];
  if(!node)throw Error('原有規則缺少 roomsV22/$code');
  const extra=extraRules();
  node.sound=extra.route;
  node.audioLinks=extra.links;
  return JSON.stringify(orig,null,2);
}
document.getElementById('copyRules').onclick=async()=>{

};
document.getElementById('downloadRules').onclick=async()=>{

  }catch(e){alert('下載失敗：'+e.message);}
};
